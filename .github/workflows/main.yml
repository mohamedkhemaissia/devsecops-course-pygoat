name: CI

on: [push]

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1

      - name: set up python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.8

      - name: install bandit
        run: pip install bandit 
      - name: run bandit scan
        run: bandit -ll -ii -r . 
        
